# ── mosquitto.conf ────────────────────────────────────────────────────────────
# Minimal Eclipse Mosquitto configuration for local/dev Docker use.
# For production: add TLS, ACL rules, and password_file.
# ──────────────────────────────────────────────────────────────────────────────

# Allow connections without authentication (dev-only)
allow_anonymous true

# MQTT listener on default port
listener 1883

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
